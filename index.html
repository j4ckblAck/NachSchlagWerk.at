<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101826">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dienstgrade">
<title>Polizei Lernapp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="kopf">
  <div class="kopf-titel">
    <span class="rot-weiss-rot" aria-hidden="true"></span>
    <h1 id="kopfTitel">Polizei Lernapp</h1>
  </div>
  <div class="kopf-aktionen">
    <button id="navZurueck" class="nav-icon" hidden aria-label="Zurück">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="themaBtn" class="ikon" aria-label="Theme umschalten">Theme</button>
    <button id="navHome" class="nav-icon" aria-label="Hauptmenü">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    </button>
  </div>
</header>

<!-- ========== STARTSEITE (App-Home) ========== -->
<main id="home" class="screen">
  <p class="intro">Wähl ein Thema aus.</p>

  <button id="gehModulDienstgrade" class="kachel kachel-modul">
    <span class="kachel-titel">Dienstgrade</span>
    <span class="kachel-text">Abzeichen der österreichischen Polizei lernen und abfragen</span>
  </button>
</main>

<!-- ========== MODUL: DIENSTGRADE - GRUPPENUEBERSICHT ========== -->
<main id="modulStart" class="screen" hidden>

  <button id="gehAbkuerzungen" class="kachel kachel-modul">
    <span class="kachel-titel">Abkürzungen</span>
    <span class="kachel-text">Kurzbezeichnungen zum Nachschlagen, kein Quiz</span>
  </button>

  <a href="tafel.pdf" target="_blank" rel="noopener" class="kachel kachel-pdf">
    <span class="kachel-titel">Amtliches Referenzdokument (PDF)</span>
    <span class="kachel-text">Die vollständige BMI-Vorschrift im Original</span>
  </a>

  <div id="gruppenListe" class="gruppen-liste"></div>

  <div id="weiteresTraining" class="weiteres-training" hidden>
    <p class="weiteres-titel">Weiteres Training</p>

    <button id="gehSchwierig" class="kachel kachel-klein" disabled>
      <span class="kachel-kopf">
        <span class="kachel-titel">Schwierige Ränge</span>
        <span class="kachel-prozent" id="schwierigProzent">0%</span>
      </span>
      <span class="kachel-text" id="schwierigStatus">Noch keine Übungsdaten vorhanden</span>
      <span class="mini-balken"><span id="schwierigBalken"></span></span>
    </button>

    <button id="gehGemischtMC" class="kachel kachel-klein">
      <span class="kachel-kopf">
        <span class="kachel-titel">Dienstgrade – mit Auswahl</span>
        <span class="kachel-prozent" id="gemischtProzentMC">0%</span>
      </span>
      <span class="kachel-text" id="gemischtStatusMC">Meistere mindestens eine Gruppe</span>
      <span class="mini-balken"><span id="gemischtBalkenMC"></span></span>
    </button>

    <button id="gehGemischtKarte" class="kachel kachel-klein">
      <span class="kachel-kopf">
        <span class="kachel-titel">Dienstgrade – ohne Auswahl</span>
        <span class="kachel-prozent" id="gemischtProzentKarte">0%</span>
      </span>
      <span class="kachel-text" id="gemischtStatusKarte">Meistere mindestens eine Gruppe</span>
      <span class="mini-balken"><span id="gemischtBalkenKarte"></span></span>
    </button>

    <button id="gehUniformMC" class="kachel kachel-klein">
      <span class="kachel-kopf">
        <span class="kachel-titel">Auf der Uniform – mit Auswahl</span>
        <span class="kachel-prozent" id="uniformProzentMC">0%</span>
      </span>
      <span class="kachel-text">Echtes Foto statt Abzeichen-Ausschnitt</span>
      <span class="mini-balken"><span id="uniformBalkenMC"></span></span>
    </button>

    <button id="gehUniformKarte" class="kachel kachel-klein">
      <span class="kachel-kopf">
        <span class="kachel-titel">Auf der Uniform – ohne Auswahl</span>
        <span class="kachel-prozent" id="uniformProzentKarte">0%</span>
      </span>
      <span class="kachel-text">Echtes Foto, Name selbst aufdecken</span>
      <span class="mini-balken"><span id="uniformBalkenKarte"></span></span>
    </button>
  </div>

  <div class="einstellungen">
    <button id="resetLernenBtn" class="reset-klein">Lernfortschritt zurücksetzen</button>
    <button id="resetQuizBtn" class="reset-klein">Quiz-Lernstand zurücksetzen</button>
  </div>
</main>

<!-- ========== LERNMODUS ========== -->
<main id="lernen" class="screen" hidden>
  <div class="fortschritt-leiste"><div id="lernBalken"></div></div>
  <p class="fortschritt-text"><span id="lernPos">1</span> / <span id="lernGesamt"></span></p>

  <div id="lernKarte" class="lernkarte"></div>

  <div class="lern-buttons">
    <button id="lernZurueck" class="knopf knopf-blass">Zurück</button>
    <button id="lernWeiter" class="knopf knopf-gold">Weiter</button>
  </div>
</main>

<!-- ========== QUIZ ========== -->
<main id="quiz" class="screen" hidden>
  <div id="hinweis" class="hinweis" hidden></div>

  <p class="quiz-kontext" id="quizKontext"></p>
  <p class="frage-typ">Welcher Dienstgrad ist das?</p>
  <img id="frageBild" class="frage-bild" src="" alt="Abzeichen">

  <div id="antworten" class="antworten"></div>

  <div id="kartenName" class="karten-name" hidden></div>

  <div id="rueckmeldung" class="rueckmeldung" hidden></div>

  <div id="gruppeFertig" class="gruppe-fertig" hidden>
    <p id="abschlussText"></p>
    <button id="gruppeFertigOk" class="knopf knopf-gold">Zur Gruppenübersicht</button>
  </div>

  <button id="weiterBtn" class="knopf knopf-gold" hidden>Weiter</button>
</main>

<div id="karteAntwort" class="karte-antwort-leiste" hidden>
  <button id="kartenAufdecken" class="knopf knopf-gold">Antwort zeigen</button>
  <div id="kartenBewertung" class="karten-bewertung" hidden>
    <button id="wusstNicht" class="knopf knopf-rot">Wusste ich nicht</button>
    <button id="wusstJa" class="knopf knopf-gruen">Wusste ich</button>
  </div>
</div>

<footer id="leiste" class="leiste" hidden>
  <div class="leiste-wert"><b id="serie">0</b> in Serie</div>
  <div class="leiste-wert"><b id="quote">–</b> richtig</div>
  <div class="leiste-wert"><b id="gelernt">0</b> von <span id="gesamt">0</span> geschafft</div>
</footer>

<!-- ========== ABKUERZUNGEN (eigenes Modul) ========== -->
<main id="abk" class="screen" hidden>
  <h2 class="modul-titel">Abkürzungen</h2>
  <div id="abkListe" class="abk-liste"></div>
  <p class="abk-quelle">Quelle: Wikipedia, BMI Untersch.-Tafel</p>
</main>

<script src="ranks.js"></script>
<script src="app.js"></script>
</body>
</html>
